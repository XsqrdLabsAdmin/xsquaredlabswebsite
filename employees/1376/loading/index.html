<script>



function check_percentage(){
 let percentage = document.querySelector('.percentage');
 let percentageValue =  +percentage.textContent;
 let title = document.querySelector('h1');


 setTimeout(function(){
   if (percentageValue < 105) {
     update_percentage(); 
   
   } 
   
   else {
     percentage.textContent = 105;   
     title.textContent = 'Welcome AG-1376'; 
     title.style.color = 'red';
     
   }
 }, 100
 )
}

function update_percentage(){   
 let percentage = document.querySelector('.percentage');
 let percentageValue =  +percentage.textContent;
 let progress = document.querySelector('.progress');
  
 percentage.textContent = percentageValue + Math.ceil(Math.random() * 10);
 progress.setAttribute('style', `width:${percentageValue + Math.ceil(Math.random() * 5)}%`);

 check_percentage();
}

check_percentage();
